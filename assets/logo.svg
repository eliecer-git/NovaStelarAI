<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="starGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Soft glow behind -->
  <circle cx="100" cy="100" r="60" fill="url(#glow)" opacity="0.6"/>
  
  <!-- 8-pointed star - main cardinal points (taller) -->
  <polygon points="100,15 108,80 100,65 92,80" fill="url(#starGrad)" filter="url(#starGlow)"/>
  <polygon points="100,185 108,120 100,135 92,120" fill="url(#starGrad)" filter="url(#starGlow)"/>
  <polygon points="15,100 80,92 65,100 80,108" fill="url(#starGrad)" filter="url(#starGlow)"/>
  <polygon points="185,100 120,92 135,100 120,108" fill="url(#starGrad)" filter="url(#starGlow)"/>
  
  <!-- 8-pointed star - diagonal points -->
  <polygon points="38,38 78,82 68,72 82,78" fill="url(#starGrad2)" filter="url(#starGlow)"/>
  <polygon points="162,38 118,78 132,72 122,82" fill="url(#starGrad2)" filter="url(#starGlow)"/>
  <polygon points="38,162 82,122 72,132 78,118" fill="url(#starGrad2)" filter="url(#starGlow)"/>
  <polygon points="162,162 122,118 128,132 118,122" fill="url(#starGrad2)" filter="url(#starGlow)"/>
  
  <!-- Central bright core -->
  <circle cx="100" cy="100" r="12" fill="white" opacity="0.9"/>
  <circle cx="100" cy="100" r="8" fill="#00e5ff" opacity="0.7"/>
  <circle cx="100" cy="100" r="4" fill="white"/>
</svg>
